# nginx для демо-стенда витрины LINKAVTO (linkavto.awwwdde.art).
# Раздаём собранный SPA из /srv/web. Бэкенд не нужен — данные отдаёт MSW в браузере.
#   - history API fallback: неизвестные пути → index.html (React Router);
#   - /healthz → 200 (awwwdde-панель ждёт healthcheck перед подключением Caddy).

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080 default_server;
        server_name _;

        root /srv/web;
        index index.html;

        # healthcheck для awwwdde-панели.
        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
            access_log off;
        }

        # Хеш-именованные ассеты Vite — длинный иммутабельный кэш.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Сервис-воркер MSW не кэшируем — чтобы демо-моки обновлялись.
        location = /mockServiceWorker.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # Любой неизвестный путь — index.html (SPA-роутер разберётся сам).
        location / {
            try_files $uri /index.html;
        }
    }
}
