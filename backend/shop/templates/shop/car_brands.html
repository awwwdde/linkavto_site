{% extends 'shop/base.html' %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Популярные бренды легковых авто</h2>

    <div class="row">
        {% for brand in brands %}
        <div class="col-md-3 col-6 mb-4">
            <div class="card h-100 border-0">
                <a href="{% url 'brand_models' brand.slug %}" class="text-decoration-none">
                    {% if brand.logo %}
                    <img src="{{ brand.logo.url }}" class="card-img-top p-3" alt="{{ brand.name }}"
                         style="height: 120px; object-fit: contain;">
                    {% endif %}
                    <div class="card-body text-center">
                        <h5 class="card-title text-dark">{{ brand.name }}</h5>
                        <small class="text-muted">{{ brand.product_set.count }} запчастей</small>
                    </div>
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
