<div class="modal fade" id="modificationsModal" tabindex="-1" aria-labelledby="modificationsModalLabel" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog modal-dialog-scrollable modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn btn-back" onclick="closeModificationsModal()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h5 class="modal-title flex-grow-1 text-center" id="modificationsModalLabel">Модификации</h5>
                <button type="button" class="btn btn-close" onclick="closeModificationsModal()" aria-label="Close"></button>  
                <button type="button" class="btn btn-outline-secondary sbros" onclick="resetModificationFilter()">Сбросить</button>
            </div>
            <div class="modal-body">
                <!-- Поиск по модификациям -->
                <div class="search-container mb-3">
                    <div class="input-group">
                       
                            <i class="fas fa-search text-muted search-icon"></i>
                        
                        <input
                            type="text"
                            class="form-control  search-input"
                            id="modificationSearchInput"
                            placeholder="Поиск модификации..."
                            oninput="searchModifications()"
                            autocomplete="off"
                            style="height: 56px; border-radius: 24px !important;"
                        >
                        <button
                            class="btn btn-outline-secondary  clear-search"
                            type="button"
                            id="clearModificationSearchBtn"
                            onclick="clearModificationSearch()"
                            style="visibility: hidden; pointer-events: none; "
                        >
                            <i class="fas fa-times search-icon" style="padding-left: 20px;"></i>
                        </button>
                    </div>
                </div>

                <!-- Счетчик найденных результатов -->
                <div class="search-results-info mb-3 px-2" id="modificationSearchResultsInfo" style="display: none;">
                    <small class="text-muted">Найдено: <span id="foundModificationsCount">0</span></small>
                </div>

                <!-- Все модификации -->
                <div class="list-group mb-3">
                    <div class="list-group-item list-group-item-action d-flex align-items-center">
                        <div class="form-check mb-0 w-100 d-flex align-items-center">
                            <input class="form-check-input me-3" type="checkbox" id="mobileModificationAll"
                                   onchange="selectAllModifications()">
                            <label class="form-check-label fw-bold w-100" for="mobileModificationAll">
                                Все модификации
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Список модификаций -->
                <div class="list-group mb-3" id="modificationList">
                    {% include "shop/partials/mobile_modifications_modal_list.html" %}
                </div>
            </div>
            <div class="modal-footer sticky-bottom bg-white border-top py-3">
                <div class="d-flex justify-content-between w-100">
                  
                    <button type="button" class="btn btn-dark" style="width: 100%;" onclick="applyMobileModificationFilter()">Применить</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Функция для транслитерации (русский ↔ английский)
function transliterate(text) {
    const ru = {
        'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
        'е': 'e', 'ё': 'e', 'ж': 'zh', 'з': 'z', 'и': 'i',
        'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
        'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
        'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'ch',
        'ш': 'sh', 'щ': 'sch', 'ь': '', 'ы': 'y', 'ъ': '',
        'э': 'e', 'ю': 'yu', 'я': 'ya',
        'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D',
        'Е': 'E', 'Ё': 'E', 'Ж': 'Zh', 'З': 'Z', 'И': 'I',
        'Й': 'Y', 'К': 'K', 'Л': 'L', 'М': 'M', 'Н': 'N',
        'О': 'O', 'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T',
        'У': 'U', 'Ф': 'F', 'Х': 'H', 'Ц': 'C', 'Ч': 'Ch',
        'Ш': 'Sh', 'Щ': 'Sch', 'Ь': '', 'Ы': 'Y', 'Ъ': '',
        'Э': 'E', 'Ю': 'Yu', 'Я': 'Ya'
    };

    const en = {
        'a': 'а', 'b': 'б', 'c': 'ц', 'd': 'д', 'e': 'е',
        'f': 'ф', 'g': 'г', 'h': 'х', 'i': 'и', 'j': 'дж',
        'k': 'к', 'l': 'л', 'm': 'м', 'n': 'н', 'o': 'о',
        'p': 'п', 'q': 'к', 'r': 'р', 's': 'с', 't': 'т',
        'u': 'у', 'v': 'в', 'w': 'в', 'x': 'кс', 'y': 'й',
        'z': 'з',
        'A': 'А', 'B': 'Б', 'C': 'Ц', 'D': 'Д', 'E': 'Е',
        'F': 'Ф', 'G': 'Г', 'H': 'Х', 'I': 'И', 'J': 'Дж',
        'K': 'К', 'L': 'Л', 'M': 'М', 'N': 'Н', 'O': 'О',
        'P': 'П', 'Q': 'К', 'R': 'Р', 'S': 'С', 'T': 'Т',
        'U': 'У', 'V': 'В', 'W': 'В', 'X': 'Кс', 'Y': 'Й',
        'Z': 'З'
    };

    let result = '';
    const textLower = text.toLowerCase();

    // Проверяем, содержит ли текст русские буквы
    const hasCyrillic = /[а-яё]/i.test(text);

    if (hasCyrillic) {
        // Русский → Английский
        for (let char of textLower) {
            result += ru[char] || char;
        }
    } else {
        // Английский → Русский (только для латинских букв)
        for (let char of textLower) {
            result += en[char] || char;
        }
    }

    return result.toLowerCase();
}

// Фильтрация модификаций по выбранным поколениям (вызывается из generations_modal.html)
function filterMobileModificationsByGenerations() {
    const generationInput = document.querySelector('#mobile-filter-form input[name="generation"]') ||
                            document.querySelector('#filter-form input[name="generation"]');
    const selectedGenerations = generationInput ? generationInput.value.split(',').map(s => s.trim()).filter(s => s) : [];

    document.querySelectorAll('#modificationList .modification-item').forEach(item => {
        const gen = item.getAttribute('data-generation');
        if (selectedGenerations.length === 0 || (gen && selectedGenerations.includes(gen))) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
}

// Функция фильтрации модификаций по поиску
function searchModifications() {
    const searchInput = document.getElementById('modificationSearchInput');
    const searchTerm = searchInput.value.toLowerCase().trim();
    const clearBtn = document.getElementById('clearModificationSearchBtn');
    const resultsInfo = document.getElementById('modificationSearchResultsInfo');
    const foundCountElement = document.getElementById('foundModificationsCount');

    // Показываем/скрываем кнопку очистки
    if (searchTerm.length > 0) {
        clearBtn.style.visibility = 'visible';
        clearBtn.style.pointerEvents = 'auto';
        searchInput.classList.remove('no-clear-btn');
    } else {
        clearBtn.style.visibility = 'hidden';
        clearBtn.style.pointerEvents = 'none';
        searchInput.classList.add('no-clear-btn');
        resultsInfo.style.display = 'none';
        // Показываем все элементы если поиск пустой
        document.querySelectorAll('.modification-item').forEach(item => {
            item.classList.remove('hidden');
        });
        return;
    }

    // Получаем транслитерированную версию поискового запроса
    const transliteratedTerm = transliterate(searchTerm);

    let foundCount = 0;

    // Фильтруем модификации
    document.querySelectorAll('.modification-item').forEach(item => {
        const modificationName = item.getAttribute('data-name');
        const modificationNameTranslit = item.getAttribute('data-name-translit');

        // Проверяем совпадения по оригинальному названию и транслитерированной версии
        const matchesOriginal = modificationName.includes(searchTerm);
        const matchesTranslit = modificationNameTranslit.includes(transliteratedTerm);
        const matchesSearchTerm = modificationName.includes(transliteratedTerm);

        if (matchesOriginal || matchesTranslit || matchesSearchTerm) {
            item.classList.remove('hidden');
            foundCount++;
        } else {
            item.classList.add('hidden');
        }
    });

    // Обновляем информацию о результатах
    if (foundCount > 0 || searchTerm.length > 0) {
        resultsInfo.style.display = 'block';
        foundCountElement.textContent = foundCount;
    } else {
        resultsInfo.style.display = 'block';
        foundCountElement.textContent = '0';
    }
}

// Функция очистки поиска
function clearModificationSearch() {
    const searchInput = document.getElementById('modificationSearchInput');
    const clearBtn = document.getElementById('clearModificationSearchBtn');
    searchInput.value = '';
    searchInput.focus();
    // Убеждаемся, что класс добавлен при очистке
    searchInput.classList.add('no-clear-btn');
    clearBtn.style.visibility = 'hidden';
    clearBtn.style.pointerEvents = 'none';
    searchModifications();
}

// Инициализация фильтрации при загрузке страницы
document.addEventListener('DOMContentLoaded', function() {
    filterMobileModificationsByGenerations();
});

// Обработка нажатия клавиши Escape в поле поиска
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('modificationSearchInput');
    if (searchInput) {
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                clearModificationSearch();
            }
        });
    }
});

function openModificationsModal(event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
    }

    // Получаем текущие выбранные модификации из скрытого поля
    const modificationInput = document.querySelector('#mobile-filter-form input[name="modification"]');
    const currentModifications = modificationInput ? modificationInput.value.split(',') : [];

    // Сбрасываем все чекбоксы
    document.querySelectorAll('#modificationsModal .form-check-input').forEach(checkbox => {
        checkbox.checked = false;
    });

    // Устанавливаем "Все модификации" если ничего не выбрано
    if (currentModifications.length === 0 || (currentModifications.length === 1 && currentModifications[0] === '')) {
        document.getElementById('mobileModificationAll').checked = true;
    } else {
        // Устанавливаем выбранные модификации
        currentModifications.forEach(modificationSlug => {
            if (modificationSlug) {
                const checkbox = document.querySelector(`.mobile-modification-checkbox[value="${modificationSlug}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                }
            }
        });
        document.getElementById('mobileModificationAll').checked = false;
    }

    updateModificationSelection();

    // Сбрасываем поиск
    clearModificationSearch();
    
    // Убеждаемся, что инпут имеет скругленные углы справа при открытии
    const searchInput = document.getElementById('modificationSearchInput');
    if (searchInput) {
        searchInput.classList.add('no-clear-btn');
    }

    // Открываем модальное окно
    const modal = new bootstrap.Modal(document.getElementById('modificationsModal'));
    modal.show();

    // Фокусируемся на поле поиска после открытия
    setTimeout(() => {
        document.getElementById('modificationSearchInput').focus();
    }, 300);

    // Дополнительная защита: предотвращаем закрытие offcanvas
    setTimeout(() => {
        const offcanvas = document.getElementById('filtersOffcanvas');
        if (offcanvas) {
            const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvas);
            if (bsOffcanvas) {
                bsOffcanvas.show();
            }
        }
    }, 50);
}

function closeModificationsModal() {
    const modal = bootstrap.Modal.getInstance(document.getElementById('modificationsModal'));
    if (modal) {
        modal.hide();
    }
}

function selectAllModifications() {
    const checkboxes = document.querySelectorAll('.mobile-modification-checkbox');
    const allCheckbox = document.getElementById('mobileModificationAll');
    checkboxes.forEach(checkbox => {
        checkbox.checked = allCheckbox.checked;
    });
}

function resetModificationFilter() {
    document.querySelectorAll('.mobile-modification-checkbox').forEach(checkbox => {
        checkbox.checked = false;
    });
    document.getElementById('mobileModificationAll').checked = false;
}

function updateModificationSelection() {
    const selectedCount = document.querySelectorAll('.mobile-modification-checkbox:checked').length;
    const allCheckbox = document.getElementById('mobileModificationAll');
    const totalCount = document.querySelectorAll('.mobile-modification-checkbox').length;

    allCheckbox.checked = selectedCount === totalCount && totalCount > 0;
}

function applyMobileModificationFilter() {
    const allCheckbox = document.getElementById('mobileModificationAll');
    const modificationInput = document.querySelector('#mobile-filter-form input[name="modification"]');
    const selectedModificationText = document.getElementById('selectedModificationText');

    if (allCheckbox.checked) {
        // Если выбрано "Все модификации"
        if (modificationInput) modificationInput.value = '';
        if (selectedModificationText) selectedModificationText.textContent = 'Все модификации';
    } else {
        // Если выбраны конкретные модификации
        const selectedModifications = Array.from(document.querySelectorAll('.mobile-modification-checkbox:checked'))
            .map(checkbox => checkbox.value);
        const selectedNames = Array.from(document.querySelectorAll('.mobile-modification-checkbox:checked'))
            .map(checkbox => checkbox.dataset.name);

        if (modificationInput) modificationInput.value = selectedModifications.join(',');
        if (selectedModificationText) {
            if (selectedNames.length === 0) {
                selectedModificationText.textContent = 'Все модификации';
            } else if (selectedNames.length === 1) {
                selectedModificationText.textContent = selectedNames[0];
            } else {
                selectedModificationText.textContent = selectedNames.join(', ');
            }
        }
    }

    // Обновляем иконку
    if (typeof updateMobileModificationIcon === 'function') {
        updateMobileModificationIcon();
    }

    closeModificationsModal();
}
</script>
