<a href="javascript:void(0)" class="list-group-item list-group-item-action" onclick="selectAllCarTypes()">
    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="mobileCarTypeAll">
        <label class="form-check-label w-100" for="mobileCarTypeAll">
            Все типы кузова
        </label>
    </div>
</a>
{% for type in car_types %}
<a href="javascript:void(0)" class="list-group-item list-group-item-action">
    <div class="form-check">
        <input class="form-check-input mobile-car-type-checkbox" type="checkbox"
               value="{{ type.slug }}" id="mobileCarType{{ type.id }}"
               data-name="{{ type.name }}">
        <label class="form-check-label w-100" for="mobileCarType{{ type.id }}">
            {{ type.name }}
        </label>
    </div>
</a>
{% endfor %}
