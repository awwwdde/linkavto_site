<!-- Модальное окно для выбора производителей -->
<div class="modal fade" id="manufacturersModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn btn-back" onclick="closeManufacturersModal()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h5 class="modal-title flex-grow-1 text-center">Бренды</h5>
                <button type="button" class="btn btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <button type="button" class="btn btn-outline-secondary sbros" onclick="resetManufacturerFilter()">
                    Сбросить
                </button>
            </div>
            <div class="modal-body">
                <!-- Поиск по производителям -->
                <div class="search-container mb-3">
                    <div class="input-group input-group-lg">
                        
                            <i class="fas fa-search text-muted search-icon"></i>
                       
                        <input
                            type="text"
                            class="form-control border-start-0 border-end-0 search-input"
                            id="manufacturerSearchInput"
                            placeholder="Поиск производителя..."
                            oninput="filterManufacturers()"
                            autocomplete="off"
                            style="height: 56px;"
                        >
                        <button
                            class="btn btn-outline-secondary border-start-0 clear-search"
                            type="button"
                            id="clearManufacturerSearchBtn"
                            onclick="clearManufacturerSearch()"
                            style="visibility: hidden; pointer-events: none;"
                        >
                            <i class="fas fa-times" style="padding-left: 20px;"></i>
                        </button>
                    </div>
                </div>

                <!-- Счетчик найденных результатов -->
                <div class="search-results-info mb-2 px-2" id="manufacturerSearchResultsInfo" style="display: none;">
                    <small class="text-muted">Найдено: <span id="foundManufacturersCount">0</span></small>
                </div>

                <div class="list-group mb-3">
                    <div class="list-group-item list-group-item-action d-flex align-items-center">
                        <div class="form-check mb-0 w-100 d-flex align-items-center">
                            <input class="form-check-input me-3" type="checkbox" id="manufacturerAll"
                                   onchange="toggleAllManufacturers(this)">
                            <label class="form-check-label fw-bold w-100" for="manufacturerAll">
                                Все производители
                            </label>
                        </div>
                    </div>
                    {% for manufacturer in manufacturers %}
                    <div class="list-group-item list-group-item-action d-flex align-items-center manufacturer-item"
                         data-name="{{ manufacturer.name|lower }}"
                         data-name-translit="{{ manufacturer.name|lower }}">
                        <div class="form-check mb-0 w-100 d-flex align-items-center">
                            <input class="form-check-input me-3 manufacturer-checkbox" type="checkbox"
                                   id="manufacturer{{ manufacturer.id }}" value="{{ manufacturer.slug }}"
                                   data-name="{{ manufacturer.name }}"
                                   onchange="updateSelectedManufacturers()">
                            <label class="form-check-label w-100 d-flex align-items-center" for="manufacturer{{ manufacturer.id }}">
                                {% if manufacturer.logo %}
                                <img src="{{ manufacturer.logo.url }}" alt="{{ manufacturer.name }}" class="brand-logo me-3" style="width: 30px; height: 30px; object-fit: contain;">
                                {% else %}
                                <div class="brand-logo-placeholder me-3 d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; background: #f8f9fa; border-radius: 4px;">
                                    <span class="text-muted" style="font-size: 12px;">{{ manufacturer.name|slice:":1" }}</span>
                                </div>
                                {% endif %}
                                <span class="manufacturer-name">{{ manufacturer.name }}</span>
                            </label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="modal-footer sticky-bottom bg-white border-top py-3">
                <div class="d-grid gap-2 w-100">
                    <button type="button" class="btn btn-dark" onclick="applyManufacturerFilter()">
                        Применить
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>

<script>
// Функция для транслитерации (русский ↔ английский)
function transliterate(text) {
    const ru = {
        'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
        'е': 'e', 'ё': 'e', 'ж': 'zh', 'з': 'z', 'и': 'i',
        'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
        'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
        'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'ch',
        'ш': 'sh', 'щ': 'sch', 'ь': '', 'ы': 'y', 'ъ': '',
        'э': 'e', 'ю': 'yu', 'я': 'ya',
        'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D',
        'Е': 'E', 'Ё': 'E', 'Ж': 'Zh', 'З': 'Z', 'И': 'I',
        'Й': 'Y', 'К': 'K', 'Л': 'L', 'М': 'M', 'Н': 'N',
        'О': 'O', 'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T',
        'У': 'U', 'Ф': 'F', 'Х': 'H', 'Ц': 'C', 'Ч': 'Ch',
        'Ш': 'Sh', 'Щ': 'Sch', 'Ь': '', 'Ы': 'Y', 'Ъ': '',
        'Э': 'E', 'Ю': 'Yu', 'Я': 'Ya'
    };

    const en = {
        'a': 'а', 'b': 'б', 'c': 'ц', 'd': 'д', 'e': 'е',
        'f': 'ф', 'g': 'г', 'h': 'х', 'i': 'и', 'j': 'дж',
        'k': 'к', 'l': 'л', 'm': 'м', 'n': 'н', 'o': 'о',
        'p': 'п', 'q': 'к', 'r': 'р', 's': 'с', 't': 'т',
        'u': 'у', 'v': 'в', 'w': 'в', 'x': 'кс', 'y': 'й',
        'z': 'з',
        'A': 'А', 'B': 'Б', 'C': 'Ц', 'D': 'Д', 'E': 'Е',
        'F': 'Ф', 'G': 'Г', 'H': 'Х', 'I': 'И', 'J': 'Дж',
        'K': 'К', 'L': 'Л', 'M': 'М', 'N': 'Н', 'O': 'О',
        'P': 'П', 'Q': 'К', 'R': 'Р', 'S': 'С', 'T': 'Т',
        'U': 'У', 'V': 'В', 'W': 'В', 'X': 'Кс', 'Y': 'Й',
        'Z': 'З'
    };

    let result = '';
    const textLower = text.toLowerCase();

    // Проверяем, содержит ли текст русские буквы
    const hasCyrillic = /[а-яё]/i.test(text);

    if (hasCyrillic) {
        // Русский → Английский
        for (let char of textLower) {
            result += ru[char] || char;
        }
    } else {
        // Английский → Русский (только для латинских букв)
        for (let char of textLower) {
            result += en[char] || char;
        }
    }

    return result.toLowerCase();
}

// Функции для работы с модальным окном производителей
let selectedManufacturers = [];

function openManufacturersModal(event) {
    // КРИТИЧЕСКИ ВАЖНО: предотвращаем закрытие offcanvas
    if (event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
    }

    // Получаем текущие выбранные производители из скрытого поля
    const manufacturerInput = document.querySelector('#mobile-filter-form input[name="manufacturer"]');
    const currentManufacturers = manufacturerInput ? manufacturerInput.value.split(',') : [];

    // Сбрасываем все чекбоксы
    document.querySelectorAll('#manufacturersModal .form-check-input').forEach(checkbox => {
        checkbox.checked = false;
    });

    // Устанавливаем "Все производители" если ничего не выбрано
    if (currentManufacturers.length === 0 || (currentManufacturers.length === 1 && currentManufacturers[0] === '')) {
        document.getElementById('manufacturerAll').checked = true;
        selectedManufacturers = [];
    } else {
        // Устанавливаем выбранные производители
        currentManufacturers.forEach(manufacturerSlug => {
            if (manufacturerSlug) {
                const checkbox = document.querySelector(`.manufacturer-checkbox[value="${manufacturerSlug}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                }
            }
        });
        document.getElementById('manufacturerAll').checked = false;
        selectedManufacturers = currentManufacturers.filter(slug => slug !== '');
    }

    updateSelectedManufacturersCount();

    // Сбрасываем поиск
    clearManufacturerSearch();
    
    // Убеждаемся, что инпут имеет скругленные углы справа при открытии
    const searchInput = document.getElementById('manufacturerSearchInput');
    if (searchInput) {
        searchInput.classList.add('no-clear-btn');
    }

    // Открываем модальное окно
    const manufacturersModal = new bootstrap.Modal(document.getElementById('manufacturersModal'));
    manufacturersModal.show();

    // Фокусируемся на поле поиска после открытия
    setTimeout(() => {
        document.getElementById('manufacturerSearchInput').focus();
    }, 300);

    // Дополнительная защита: предотвращаем закрытие offcanvas
    setTimeout(() => {
        const offcanvas = document.getElementById('filtersOffcanvas');
        if (offcanvas) {
            const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvas);
            if (bsOffcanvas) {
                // Принудительно показываем offcanvas если он закрылся
                bsOffcanvas.show();
            }
        }
    }, 50);
}

function closeManufacturersModal() {
    const manufacturersModal = bootstrap.Modal.getInstance(document.getElementById('manufacturersModal'));
    if (manufacturersModal) {
        manufacturersModal.hide();
    }
    // Offcanvas фильтров остается открытым
}

function toggleAllManufacturers(checkbox) {
    const manufacturerCheckboxes = document.querySelectorAll('.manufacturer-checkbox');
    if (checkbox.checked) {
        // Если выбрано "Все производители", снимаем выбор с остальных
        manufacturerCheckboxes.forEach(cb => cb.checked = false);
        selectedManufacturers = [];
    }
    updateSelectedManufacturersCount();
}

function updateSelectedManufacturers() {
    const manufacturerAll = document.getElementById('manufacturerAll');
    const selectedCheckboxes = document.querySelectorAll('.manufacturer-checkbox:checked');

    // Если выбраны конкретные производители, снимаем "Все производители"
    if (selectedCheckboxes.length > 0) {
        manufacturerAll.checked = false;
    }

    // Обновляем массив выбранных производителей
    selectedManufacturers = Array.from(selectedCheckboxes).map(checkbox => checkbox.value);
    updateSelectedManufacturersCount();
}

function updateSelectedManufacturersCount() {
    const count = selectedManufacturers.length;
    const countElement = document.getElementById('selectedManufacturerCount');
    if (countElement) {
        countElement.textContent = `Выбрано: ${count} ${getManufacturerWord(count)}`;
    }
}

function getManufacturerWord(count) {
    if (count === 1) return 'производитель';
    if (count >= 2 && count <= 4) return 'производителя';
    return 'производителей';
}

function clearAllManufacturers() {
    document.querySelectorAll('#manufacturersModal .form-check-input').forEach(checkbox => {
        checkbox.checked = false;
    });
    document.getElementById('manufacturerAll').checked = true;
    selectedManufacturers = [];
    updateSelectedManufacturersCount();
}

// Функция фильтрации производителей по поиску
function filterManufacturers() {
    const searchInput = document.getElementById('manufacturerSearchInput');
    const searchTerm = searchInput.value.toLowerCase().trim();
    const clearBtn = document.getElementById('clearManufacturerSearchBtn');
    const resultsInfo = document.getElementById('manufacturerSearchResultsInfo');
    const foundCountElement = document.getElementById('foundManufacturersCount');

    // Показываем/скрываем кнопку очистки
    if (searchTerm.length > 0) {
        clearBtn.style.visibility = 'visible';
        clearBtn.style.pointerEvents = 'auto';
        searchInput.classList.remove('no-clear-btn');
    } else {
        clearBtn.style.visibility = 'hidden';
        clearBtn.style.pointerEvents = 'none';
        searchInput.classList.add('no-clear-btn');
        resultsInfo.style.display = 'none';
        // Показываем все элементы если поиск пустой
        document.querySelectorAll('.manufacturer-item').forEach(item => {
            item.classList.remove('hidden');
        });
        return;
    }

    // Получаем транслитерированную версию поискового запроса
    const transliteratedTerm = transliterate(searchTerm);

    let foundCount = 0;

    // Фильтруем производителей
    document.querySelectorAll('.manufacturer-item').forEach(item => {
        const manufacturerName = item.getAttribute('data-name');
        const manufacturerNameTranslit = item.getAttribute('data-name-translit');

        // Проверяем совпадения по оригинальному названию и транслитерированной версии
        const matchesOriginal = manufacturerName.includes(searchTerm);
        const matchesTranslit = manufacturerNameTranslit.includes(transliteratedTerm);
        const matchesSearchTerm = manufacturerName.includes(transliteratedTerm);

        if (matchesOriginal || matchesTranslit || matchesSearchTerm) {
            item.classList.remove('hidden');
            foundCount++;
        } else {
            item.classList.add('hidden');
        }
    });

    // Обновляем информацию о результатах
    if (foundCount > 0) {
        resultsInfo.style.display = 'block';
        foundCountElement.textContent = foundCount;
    } else {
        resultsInfo.style.display = 'block';
        foundCountElement.textContent = '0';
    }
}

// Функция очистки поиска
function clearManufacturerSearch() {
    const searchInput = document.getElementById('manufacturerSearchInput');
    const clearBtn = document.getElementById('clearManufacturerSearchBtn');
    searchInput.value = '';
    searchInput.focus();
    // Убеждаемся, что класс добавлен при очистке
    searchInput.classList.add('no-clear-btn');
    clearBtn.style.visibility = 'hidden';
    clearBtn.style.pointerEvents = 'none';
    filterManufacturers();
}

// Обработка нажатия клавиши Escape в поле поиска
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('manufacturerSearchInput');
    if (searchInput) {
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                clearManufacturerSearch();
            }
        });
    }
});

function applyManufacturerFilter() {
    const manufacturerAll = document.getElementById('manufacturerAll');
    const manufacturerInput = document.querySelector('#mobile-filter-form input[name="manufacturer"]');
    const selectedManufacturerText = document.getElementById('selectedManufacturerText');

    if (manufacturerAll.checked) {
        // Если выбрано "Все производители"
        if (manufacturerInput) manufacturerInput.value = '';
        if (selectedManufacturerText) selectedManufacturerText.textContent = 'Все производители';
    } else {
        // Если выбраны конкретные производители
        const manufacturerSlugs = selectedManufacturers.join(',');
        if (manufacturerInput) manufacturerInput.value = manufacturerSlugs;

        // Обновляем текст на кнопке
        if (selectedManufacturerText) {
            if (selectedManufacturers.length === 0) {
                selectedManufacturerText.textContent = 'Все производители';
            } else if (selectedManufacturers.length === 1) {
                const selectedCheckbox = document.querySelector(`.manufacturer-checkbox[value="${selectedManufacturers[0]}"]`);
                const manufacturerName = selectedCheckbox ? selectedCheckbox.getAttribute('data-name') : 'Производитель';
                selectedManufacturerText.textContent = manufacturerName;
            } else {
                // ПОЛУЧАЕМ НАЗВАНИЯ ВСЕХ ВЫБРАННЫХ ПРОИЗВОДИТЕЛЕЙ
                const selectedManufacturerNames = [];
                selectedManufacturers.forEach(manufacturerSlug => {
                    const checkbox = document.querySelector(`.manufacturer-checkbox[value="${manufacturerSlug}"]`);
                    if (checkbox) {
                        selectedManufacturerNames.push(checkbox.getAttribute('data-name'));
                    }
                });
                // ОТОБРАЖАЕМ НАЗВАНИЯ ЧЕРЕЗ ЗАПЯТУЮ
                selectedManufacturerText.textContent = selectedManufacturerNames.join(', ');
            }
        }
    }

    // Закрываем только модальное окно производителей, оставляя offcanvas открытым
    closeManufacturersModal();
}

function resetManufacturerFilter() {
    clearAllManufacturers();
    applyManufacturerFilter();
}
</script>
