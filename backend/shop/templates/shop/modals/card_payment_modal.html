{% load static %}
<div class="modal fade" id="cardPaymentModal" tabindex="-1" aria-labelledby="cardPaymentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fs-5 fw-semibold">Оплата картой</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pt-1">
        <form id="cardPaymentForm" class="needs-validation" novalidate>
          <!-- Карта-превью -->
          <div class="card-preview mb-4 p-3 rounded-3" id="cardPreview">
            <div class="d-flex justify-content-between align-items-start mb-4">
            </div>
            <div class="mb-3">
              <div class="card-number-preview text-white fs-5 fw-medium mb-2" id="cardNumberPreview">•••• •••• •••• ••••</div>
              <div class="d-flex justify-content-between text-white-50">
                <span id="cardExpiryPreview">••/••</span>
              </div>
            </div>
          </div>

          <!-- Поля формы -->
          <div class="mb-3">
            <label for="cardNumber" class="form-label small text-muted mb-1">Номер карты</label>
            <div class="input-group">
              <input type="text" class="form-control py-2" id="cardNumber" placeholder="1234 5678 9012 3456" required
                     pattern="[\d ]{16,19}" maxlength="19">
            </div>
            <div class="invalid-feedback">Введите корректный номер карты</div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="cardExpiry" class="form-label small text-muted mb-1">Срок действия</label>
              <input type="text" class="form-control py-2" id="cardExpiry" placeholder="ММ/ГГ" required
                     pattern="\d{2}/\d{2}" maxlength="5">
              <div class="invalid-feedback">Введите срок в формате ММ/ГГ</div>
            </div>
            <div class="col-6">
              <label for="cardCvv" class="form-label small text-muted mb-1">CVV/CVC</label>
              <div class="input-group">
                <input type="password" class="form-control py-2" id="cardCvv" placeholder="•••" required
                       pattern="\d{3}" maxlength="3">
              </div>
              <div class="invalid-feedback">Введите 3 цифры с обратной стороны карты</div>
            </div>
          </div>

          <div class="d-flex justify-content-center gap-3 mb-3">
            <img src="{% static 'shop/img/visa.png' %}" alt="Visa" style="height: 24px; filter: grayscale(30%); opacity: 0.8;">
            <img src="{% static 'shop/img/mastercard.png' %}" alt="Mastercard" style="height: 24px; filter: grayscale(30%); opacity: 0.8;">
            <img src="{% static 'shop/img/mir.png' %}" alt="МИР" style="height: 24px; filter: grayscale(30%); opacity: 0.8;">
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary px-4 rounded-pill" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary px-4 rounded-pill" onclick="processCardPayment()">
          <span class="spinner-border spinner-border-sm d-none" id="paymentSpinner" role="status"></span>
          <span id="paymentText">Оплатить</span>
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .card-preview {
    background: linear-gradient(135deg, #434343 0%, #000000 100%);
    color: white;
    height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  .card-preview:after {
    content: "";
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
  }

  .form-control {
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    transition: all 0.2s;
  }

  .form-control:focus {
    border-color: #6c757d;
    box-shadow: 0 0 0 0.2rem rgba(108, 117, 125, 0.1);
  }

  .form-label {
    letter-spacing: 0.5px;
  }

  .rounded-pill {
    padding: 0.5rem 1.5rem;
  }
</style>

<script>
  // Динамическое обновление карты-превью
  const cardNumberInput = document.getElementById('cardNumber');
  if (cardNumberInput) {
    cardNumberInput.addEventListener('input', function(e) {
    let value = e.target.value.replace(/\s/g, '');
    let formatted = value.replace(/(\d{4})/g, '$1 ').trim();
    e.target.value = formatted;
    document.getElementById('cardNumberPreview').textContent =
      formatted + '•••• •••• ••••'.substring(formatted.length);
    });
  }

  const cardExpiryInput = document.getElementById('cardExpiry');
  if (cardExpiryInput) {
    cardExpiryInput.addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 2) {
      value = value.substring(0, 2) + '/' + value.substring(2, 4);
    }
    e.target.value = value;
    document.getElementById('cardExpiryPreview').textContent =
      value + '••/••'.substring(value.length);
    });
  }


  function processCardPayment() {
    const form = document.getElementById('cardPaymentForm');
    const spinner = document.getElementById('paymentSpinner');
    const text = document.getElementById('paymentText');

    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    // Показываем спиннер загрузки
    spinner.classList.remove('d-none');
    text.textContent = 'Обработка...';

    // Симуляция запроса на сервер
    setTimeout(() => {
      // Здесь будет реальный AJAX-запрос
      alert('Оплата прошла успешно!');
      bootstrap.Modal.getInstance(document.getElementById('cardPaymentModal')).hide();

      // Возвращаем кнопку в исходное состояние
      spinner.classList.add('d-none');
      text.textContent = 'Оплатить';
    }, 2000);
  }
</script>
