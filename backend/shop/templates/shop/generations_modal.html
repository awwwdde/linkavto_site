<!-- Фильтры для выбора поколений -->
<div class="modal fade" id="generationsModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn btn-back" onclick="closeGenerationsModal()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h5 class="modal-title flex-grow-1 text-center">Выберите поколения</h5>
                <button type="button" class="btn btn-close sab" data-bs-dismiss="modal" aria-label="Close"></button>
                <button type="button" class="btn btn-outline-secondary sbros" onclick="resetGenerationFilter()">
                    Сбросить
                </button>
            </div>
            <div class="modal-body">
                <!-- Поиск по поколениям -->
                <div class="search-container mb-3">
                    <div class="input-group input-group-lg">
                       
                            <i class="fas fa-search text-muted search-icon"></i>
                       
                        <input
                            type="text"
                            class="form-control border-start-0 border-end-0 search-input"
                            id="generationSearchInput"
                            placeholder="Поиск поколения..."
                            oninput="filterGenerations()"
                            autocomplete="off"
                            style="height: 56px; border-radius: 24px !important;"
                        >
                        <button
                            class="btn btn-outline-secondary border-start-0 clear-search"
                            type="button"
                            id="clearGenerationSearchBtn"
                            onclick="clearGenerationSearch()"
                            style="visibility: hidden; pointer-events: none;"
                        >
                            <i class="fas fa-times" style="padding-left: 20px;"></i>
                        </button>
                    </div>
                </div>

                <!-- Счетчик найденных результатов -->
                <div class="search-results-info mb-2 px-2" id="generationSearchResultsInfo" style="display: none;">
                    <small class="text-muted">Найдено: <span id="foundGenerationsCount">0</span></small>
                </div>

                <div class="list-group mb-3" id="generationsModalList">
                    {% include "shop/partials/mobile_generations_modal_list.html" %}
                </div>
            </div>
            <div class="modal-footer sticky-bottom bg-white border-top py-3">
                <div class="d-grid gap-2 w-100">
                    <button type="button" class="btn btn-dark" onclick="applyGenerationFilter()">
                        Применить
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Функция для транслитерации (русский ↔ английский)
function transliterate(text) {
    const ru = {
        'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
        'е': 'e', 'ё': 'e', 'ж': 'zh', 'з': 'z', 'и': 'i',
        'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
        'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
        'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'ch',
        'ш': 'sh', 'щ': 'sch', 'ь': '', 'ы': 'y', 'ъ': '',
        'э': 'e', 'ю': 'yu', 'я': 'ya',
        'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D',
        'Е': 'E', 'Ё': 'E', 'Ж': 'Zh', 'З': 'Z', 'И': 'I',
        'Й': 'Y', 'К': 'K', 'Л': 'L', 'М': 'M', 'Н': 'N',
        'О': 'O', 'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T',
        'У': 'U', 'Ф': 'F', 'Х': 'H', 'Ц': 'C', 'Ч': 'Ch',
        'Ш': 'Sh', 'Щ': 'Sch', 'Ь': '', 'Ы': 'Y', 'Ъ': '',
        'Э': 'E', 'Ю': 'Yu', 'Я': 'Ya'
    };

    const en = {
        'a': 'а', 'b': 'б', 'c': 'ц', 'd': 'д', 'e': 'е',
        'f': 'ф', 'g': 'г', 'h': 'х', 'i': 'и', 'j': 'дж',
        'k': 'к', 'l': 'л', 'm': 'м', 'n': 'н', 'o': 'о',
        'p': 'п', 'q': 'к', 'r': 'р', 's': 'с', 't': 'т',
        'u': 'у', 'v': 'в', 'w': 'в', 'x': 'кс', 'y': 'й',
        'z': 'з',
        'A': 'А', 'B': 'Б', 'C': 'Ц', 'D': 'Д', 'E': 'Е',
        'F': 'Ф', 'G': 'Г', 'H': 'Х', 'I': 'И', 'J': 'Дж',
        'K': 'К', 'L': 'Л', 'M': 'М', 'N': 'Н', 'O': 'О',
        'P': 'П', 'Q': 'К', 'R': 'Р', 'S': 'С', 'T': 'Т',
        'U': 'У', 'V': 'В', 'W': 'В', 'X': 'Кс', 'Y': 'Й',
        'Z': 'З'
    };

    let result = '';
    const textLower = text.toLowerCase();

    // Проверяем, содержит ли текст русские буквы
    const hasCyrillic = /[а-яё]/i.test(text);

    if (hasCyrillic) {
        // Русский → Английский
        for (let char of textLower) {
            result += ru[char] || char;
        }
    } else {
        // Английский → Русский (только для латинских букв)
        for (let char of textLower) {
            result += en[char] || char;
        }
    }

    return result.toLowerCase();
}

// Функции для работы с модальным окном поколений
let selectedGenerations = [];

function openGenerationsModal(event) {
    // КРИТИЧЕСКИ ВАЖНО: предотвращаем закрытие offcanvas
    if (event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
    }

    // Получаем текущие выбранные поколения из скрытого поля
    const generationInput = document.querySelector('#mobile-filter-form input[name="generation"]');
    const currentGenerations = generationInput ? generationInput.value.split(',') : [];

    // Сбрасываем все чекбоксы
    document.querySelectorAll('#generationsModal .form-check-input').forEach(checkbox => {
        checkbox.checked = false;
    });

    // Устанавливаем "Все поколения" если ничего не выбрано
    if (currentGenerations.length === 0 || (currentGenerations.length === 1 && currentGenerations[0] === '')) {
        document.getElementById('generationAll').checked = true;
        selectedGenerations = [];
    } else {
        // Устанавливаем выбранные поколения
        currentGenerations.forEach(generationSlug => {
            if (generationSlug) {
                const checkbox = document.querySelector(`.generation-checkbox[value="${generationSlug}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                }
            }
        });
        document.getElementById('generationAll').checked = false;
        selectedGenerations = currentGenerations.filter(slug => slug !== '');
    }

    updateSelectedGenerationsCount();

    // Фильтруем поколения по выбранным моделям
    filterGenerationsBySelectedModels();

    // Сбрасываем поиск
    clearGenerationSearch();
    
    // Убеждаемся, что инпут имеет скругленные углы справа при открытии
    const searchInput = document.getElementById('generationSearchInput');
    if (searchInput) {
        searchInput.classList.add('no-clear-btn');
    }

    // Открываем модальное окно
    const generationsModal = new bootstrap.Modal(document.getElementById('generationsModal'));
    generationsModal.show();

    // Фокусируемся на поле поиска после открытия
    setTimeout(() => {
        document.getElementById('generationSearchInput').focus();
    }, 300);

    // Дополнительная защита: предотвращаем закрытие offcanvas
    setTimeout(() => {
        const offcanvas = document.getElementById('filtersOffcanvas');
        if (offcanvas) {
            const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvas);
            if (bsOffcanvas) {
                // Принудительно показываем offcanvas если он закрылся
                bsOffcanvas.show();
            }
        }
    }, 50);
}

function closeGenerationsModal() {
    const generationsModal = bootstrap.Modal.getInstance(document.getElementById('generationsModal'));
    if (generationsModal) {
        generationsModal.hide();
    }
    // Offcanvas фильтров остается открытым
}

function toggleAllGenerations(checkbox) {
    const generationCheckboxes = document.querySelectorAll('.generation-checkbox');
    if (checkbox.checked) {
        // Если выбрано "Все поколения", снимаем выбор с остальных
        generationCheckboxes.forEach(cb => cb.checked = false);
        selectedGenerations = [];
    }
    updateSelectedGenerationsCount();
}

function updateSelectedGenerations() {
    const generationAll = document.getElementById('generationAll');
    const selectedCheckboxes = document.querySelectorAll('.generation-checkbox:checked');

    // Если выбраны конкретные поколения, снимаем "Все поколения"
    if (selectedCheckboxes.length > 0) {
        generationAll.checked = false;
    }

    // Обновляем массив выбранных поколений
    selectedGenerations = Array.from(selectedCheckboxes).map(checkbox => checkbox.value);
    updateSelectedGenerationsCount();
}

function updateSelectedGenerationsCount() {
    const count = selectedGenerations.length;
    const countElement = document.getElementById('selectedGenerationsCount');
    if (countElement) {
        countElement.textContent = `Выбрано: ${count} ${getGenerationWord(count)}`;
    }
}

function getGenerationWord(count) {
    if (count === 1) return 'поколение';
    if (count >= 2 && count <= 4) return 'поколения';
    return 'поколений';
}

function clearAllGenerations() {
    document.querySelectorAll('#generationsModal .form-check-input').forEach(checkbox => {
        checkbox.checked = false;
    });
    document.getElementById('generationAll').checked = true;
    selectedGenerations = [];
    updateSelectedGenerationsCount();
}

// Функция фильтрации поколений по поиску
function filterGenerations() {
    const searchInput = document.getElementById('generationSearchInput');
    const searchTerm = searchInput.value.toLowerCase().trim();
    const clearBtn = document.getElementById('clearGenerationSearchBtn');
    const resultsInfo = document.getElementById('generationSearchResultsInfo');
    const foundCountElement = document.getElementById('foundGenerationsCount');

    // Показываем/скрываем кнопку очистки
    if (searchTerm.length > 0) {
        clearBtn.style.visibility = 'visible';
        clearBtn.style.pointerEvents = 'auto';
        searchInput.classList.remove('no-clear-btn');
    } else {
        clearBtn.style.visibility = 'hidden';
        clearBtn.style.pointerEvents = 'none';
        searchInput.classList.add('no-clear-btn');
        resultsInfo.style.display = 'none';
        // Показываем все элементы если поиск пустой
        document.querySelectorAll('.generation-item').forEach(item => {
            item.classList.remove('hidden');
        });
        document.querySelectorAll('.model-section').forEach(section => {
            section.classList.remove('hidden');
            const header = section.querySelector('.model-header');
            if (header) header.classList.remove('hidden-within');
        });
        return;
    }

    // Получаем транслитерированную версию поискового запроса
    const transliteratedTerm = transliterate(searchTerm);

    let foundGenerationsCount = 0;
    let foundModelsWithGenerations = new Set();

    // Фильтруем поколения
    document.querySelectorAll('.generation-item').forEach(item => {
        const generationName = item.getAttribute('data-name');
        const generationNameTranslit = item.getAttribute('data-name-translit');
        const modelSlug = item.getAttribute('data-model');

        // Проверяем совпадения по оригинальному названию и транслитерированной версии
        const matchesOriginal = generationName.includes(searchTerm);
        const matchesTranslit = generationNameTranslit.includes(transliteratedTerm);
        const matchesSearchTerm = generationName.includes(transliteratedTerm);

        if (matchesOriginal || matchesTranslit || matchesSearchTerm) {
            item.classList.remove('hidden');
            foundGenerationsCount++;
            foundModelsWithGenerations.add(modelSlug);
        } else {
            item.classList.add('hidden');
        }
    });

    // Обновляем видимость секций моделей
    document.querySelectorAll('.model-section').forEach(section => {
        const header = section.querySelector('.model-header');
        if (!header) return;

        const modelSlug = header.getAttribute('data-model-slug');
        const modelName = header.getAttribute('data-model-name');
        const modelNameTranslit = header.getAttribute('data-model-name-translit');

        // Проверяем, совпадает ли модель с поиском
        const modelMatchesOriginal = modelName.includes(searchTerm);
        const modelMatchesTranslit = modelNameTranslit.includes(transliteratedTerm);

        // Проверяем, есть ли видимые поколения в этой секции
        const visibleGenerations = section.querySelectorAll('.generation-item:not(.hidden)');

        if (modelMatchesOriginal || modelMatchesTranslit || visibleGenerations.length > 0 || foundModelsWithGenerations.has(modelSlug)) {
            section.classList.remove('hidden');
            if (visibleGenerations.length === 0 && !modelMatchesOriginal && !modelMatchesTranslit) {
                header.classList.add('hidden-within');
            } else {
                header.classList.remove('hidden-within');
            }
        } else {
            section.classList.add('hidden');
        }
    });

    // Обновляем информацию о результатах
    if (foundGenerationsCount > 0 || searchTerm.length > 0) {
        resultsInfo.style.display = 'block';
        foundCountElement.textContent = foundGenerationsCount;
    } else {
        resultsInfo.style.display = 'none';
    }
}

// Функция очистки поиска
function clearGenerationSearch() {
    const searchInput = document.getElementById('generationSearchInput');
    const clearBtn = document.getElementById('clearGenerationSearchBtn');
    searchInput.value = '';
    searchInput.focus();
    // Убеждаемся, что класс добавлен при очистке
    searchInput.classList.add('no-clear-btn');
    clearBtn.style.visibility = 'hidden';
    clearBtn.style.pointerEvents = 'none';
    filterGenerations();
}

// Обработка нажатия клавиши Escape в поле поиска
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('generationSearchInput');
    if (searchInput) {
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                clearGenerationSearch();
            }
        });
    }
});

function applyGenerationFilter() {
    const generationAll = document.getElementById('generationAll');
    const generationInput = document.querySelector('#mobile-filter-form input[name="generation"]');
    const selectedGenerationText = document.getElementById('selectedGenerationText');

    if (generationAll.checked) {
        // Если выбрано "Все поколения"
        if (generationInput) generationInput.value = '';
        if (selectedGenerationText) selectedGenerationText.textContent = 'Все поколения';
    } else {
        // Если выбраны конкретные поколения
        const generationSlugs = selectedGenerations.join(',');
        if (generationInput) generationInput.value = generationSlugs;

        // Обновляем текст на кнопке
        if (selectedGenerationText) {
            if (selectedGenerations.length === 0) {
                selectedGenerationText.textContent = 'Все поколения';
            } else if (selectedGenerations.length === 1) {
                const selectedCheckbox = document.querySelector(`.generation-checkbox[value="${selectedGenerations[0]}"]`);
                const generationName = selectedCheckbox ? selectedCheckbox.getAttribute('data-name') : 'Поколение';
                selectedGenerationText.textContent = generationName;
            } else {
                // ПОЛУЧАЕМ НАЗВАНИЯ ВСЕХ ВЫБРАННЫХ ПОКОЛЕНИЙ
                const selectedGenerationNames = [];
                selectedGenerations.forEach(generationSlug => {
                    const checkbox = document.querySelector(`.generation-checkbox[value="${generationSlug}"]`);
                    if (checkbox) {
                        selectedGenerationNames.push(checkbox.getAttribute('data-name'));
                    }
                });
                // ОТОБРАЖАЕМ НАЗВАНИЯ ЧЕРЕЗ ЗАПЯТУЮ
                selectedGenerationText.textContent = selectedGenerationNames.join(', ');
            }
        }
    }

    // Обновляем иконку
    if (typeof updateMobileGenerationIcon === 'function') {
        updateMobileGenerationIcon();
    }

    // При смене поколения сбрасываем зависимый фильтр модификаций
    const modificationInput = document.querySelector('#mobile-filter-form input[name="modification"]');
    if (modificationInput) modificationInput.value = '';
    const selectedModificationText = document.getElementById('selectedModificationText');
    if (selectedModificationText) selectedModificationText.textContent = 'Все модификации';

    // Обновляем список модификаций в мобильном модале
    if (typeof filterMobileModificationsByGenerations === 'function') {
        filterMobileModificationsByGenerations();
    }

    // Закрываем только модальное окно поколений, оставляя offcanvas открытым
    closeGenerationsModal();
}

function resetGenerationFilter() {
    clearAllGenerations();
    applyGenerationFilter();
}

// Функция фильтрации поколений по выбранным моделям
function filterGenerationsBySelectedModels() {
    // Получаем выбранные модели из скрытого поля
    const modelInput = document.querySelector('#mobile-filter-form input[name="model"]') ||
                       document.querySelector('#filter-form input[name="model"]');
    const selectedModels = modelInput ? modelInput.value.split(',').map(s => s.trim()).filter(s => s) : [];

    // Получаем все поколения и секции моделей
    const allGenerations = document.querySelectorAll('#generationsModal .generation-checkbox');
    const allModelSections = document.querySelectorAll('#generationsModal .model-section');

    if (selectedModels.length > 0) {
        // Показываем только поколения выбранных моделей
        allGenerations.forEach(checkbox => {
            const generationModel = checkbox.getAttribute('data-model');
            const generationItem = checkbox.closest('.generation-item');
            if (selectedModels.includes(generationModel)) {
                if (generationItem) generationItem.style.display = 'flex';
            } else {
                if (generationItem) generationItem.style.display = 'none';
            }
        });

        // Показываем/скрываем секции моделей
        allModelSections.forEach(section => {
            const hasVisibleGenerations = section.querySelector('.generation-item[style*="display: flex"]') ||
                                        Array.from(section.querySelectorAll('.generation-checkbox')).some(cb => {
                                            const modelSlug = cb.getAttribute('data-model');
                                            return selectedModels.includes(modelSlug);
                                        });

            if (hasVisibleGenerations) {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        });
    } else {
        // Показываем все поколения, если модели не выбраны
        allGenerations.forEach(checkbox => {
            const generationItem = checkbox.closest('.generation-item');
            if (generationItem) generationItem.style.display = 'flex';
        });
        
        allModelSections.forEach(section => {
            section.style.display = 'block';
        });
    }
}
</script>
