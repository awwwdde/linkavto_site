<!-- Модальное окно импорта товаров -->
<div class="modal fade" id="importProductsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Импорт товаров</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Содержимое модального окна импорта (оставляем как было) -->
                <div class="row">
                    <div class="col-12">
                        <!-- Шаги импорта -->
                        <div class="import-steps mb-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="step active" data-step="1">
                                    <span class="step-number">1</span>
                                    <span class="step-label">Загрузка файла</span>
                                </div>
                                <div class="step-line"></div>
                                <div class="step" data-step="2">
                                    <span class="step-number">2</span>
                                    <span class="step-label">Настройка полей</span>
                                </div>
                                <div class="step-line"></div>
                                <div class="step" data-step="3">
                                    <span class="step-number">3</span>
                                    <span class="step-label">Проверка данных</span>
                                </div>
                            </div>
                        </div>

                        <!-- Шаг 1: Загрузка файла -->
                        <div class="import-step step-1 active">
                            <div class="file-upload-area p-4 border rounded text-center mb-3">
                                <i class="bi bi-cloud-upload fs-1 text-muted mb-3"></i>
                                <h5>Перетащите файл сюда</h5>
                                <p class="text-muted">Поддерживаемые форматы: CSV, XLSX, XLS</p>
                                <input type="file" id="importFile" accept=".csv,.xlsx,.xls" style="display: none;">
                                <button type="button" class="btn btn-primary mt-2" onclick="document.getElementById('importFile').click()">
                                    <i class="bi bi-folder2-open me-2"></i>Выбрать файл
                                </button>
                            </div>
                            <div class="file-info" id="fileInfo" style="display: none;">
                                <div class="alert alert-info">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <i class="bi bi-file-earmark-text me-2"></i>
                                            <span id="fileName"></span>
                                            <small class="text-muted" id="fileSize"></small>
                                        </div>
                                        <button type="button" class="btn-close" onclick="clearImportFile()"></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Шаг 2: Настройка полей -->
                        <div class="import-step step-2" style="display: none;">
                            <div class="field-mapping mb-3">
                                <h6 class="mb-3">Сопоставление полей</h6>
                                <div id="fieldMapping" class="row g-2">
                                    <!-- Поля будут заполнены динамически -->
                                </div>
                            </div>
                            <div class="import-settings">
                                <h6 class="mb-3">Настройки импорта</h6>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="updateExisting" checked>
                                    <label class="form-check-label" for="updateExisting">
                                        Обновлять существующие товары
                                    </label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="deactivateMissing" checked>
                                    <label class="form-check-label" for="deactivateMissing">
                                        Деактивировать отсутствующие в файле товары
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Шаг 3: Проверка данных -->
                        <div class="import-step step-3" style="display: none;">
                            <div class="import-preview">
                                <h6 class="mb-3">Предпросмотр данных</h6>
                                <div class="table-responsive">
                                    <table class="table table-sm table-bordered">
                                        <thead id="previewHeaders">
                                            <!-- Заголовки будут заполнены динамически -->
                                        </thead>
                                        <tbody id="previewBody">
                                            <!-- Данные будут заполнены динамически -->
                                        </tbody>
                                    </table>
                                </div>
                                <div class="import-summary mt-3">
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="card bg-light">
                                                <div class="card-body text-center">
                                                    <div class="h4 mb-0" id="totalRows">0</div>
                                                    <small class="text-muted">Всего строк</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="card bg-light">
                                                <div class="card-body text-center">
                                                    <div class="h4 mb-0 text-success" id="validRows">0</div>
                                                    <small class="text-muted">Валидных</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="card bg-light">
                                                <div class="card-body text-center">
                                                    <div class="h4 mb-0 text-warning" id="warningRows">0</div>
                                                    <small class="text-muted">С предупреждениями</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-outline-secondary" id="importPrevBtn" style="display: none;">
                    <i class="bi bi-arrow-left me-2"></i>Назад
                </button>
                <button type="button" class="btn btn-primary" id="importNextBtn">
                    Далее <i class="bi bi-arrow-right ms-2"></i>
                </button>
                <button type="button" class="btn btn-success" id="importStartBtn" style="display: none;">
                    <i class="bi bi-play-circle me-2"></i>Начать импорт
                </button>
            </div>
        </div>
    </div>
</div>
