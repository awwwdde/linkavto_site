        const sortbuttonslog = document.querySelector('.ButtonsSortLogical')
        
        
        if(sortbuttonopen){
        sortbuttonopen.addEventListener('click', ()=>{
           sortbuttonslog.style.display = 'flex';
            sortbuttonclose.style ='display: flex; padding: 1rem;'
            sortbuttonopen.style.display ='none'
        })}

            sortbuttonclose.addEventListener('click', ()=>{
                sortbuttonslog.style.display ='none'
                sortbuttonclose.style = 'display: none; padding: 12px;'
                sortbuttonopen.style.display ='flex'
            })
        }
    })
</script>

                            <!-- Фильтр Оригинал -->

                                           id="original" {% if request.GET.is_original %}checked{% endif %}>

                break;
        }}
        document.addEventListener('DOMContentLoaded', function() {
        Selectfillter();

</script>
<script>
// Глобальные функции для фильтрации
window.applyFilters = function() {
    // Показываем индикатор загрузки
    if (typeof showLoadingIndicator === 'function') {
        showLoadingIndicator();
    }

    // Сохраняем выбранные значения всех элементов формы перед AJAX запросом
    const selectedValues = {};

    // Определяем, какая форма активна (десктоп или мобильная)
    const isDesktop = window.innerWidth >= 768;
    const formSelector = isDesktop ? '#filter-form' : '#mobile-filter-form';
    const activeFormElement = document.querySelector(formSelector);

    console.log('Window width:', window.innerWidth, 'isDesktop:', isDesktop, 'formSelector:', formSelector);

    if (activeFormElement) {
        // Обрабатываем все select элементы
        const allSelects = activeFormElement.querySelectorAll('select[name]');
        console.log(`Found ${allSelects.length} select elements in ${formSelector}`);

        allSelects.forEach(select => {
            if (select.name) {
                // Проверяем, видим ли элемент (не скрыт через display: none или visibility: hidden)
                const isVisible = select.offsetParent !== null;
                const value = select.options[select.selectedIndex]?.value || '';

                console.log(`Select ${select.name}: value="${value}", visible=${isVisible}`);

                // Приоритет: непустое значение из видимого элемента > любое значение из видимого элемента > непустое из невидимого
                if (isVisible) {
                    // Если элемент видим, всегда используем его значение (включая пустое)
                    selectedValues[select.name] = value;
                } else if (value && !selectedValues.hasOwnProperty(select.name)) {
                    // Если элемент невидим, но имеет значение, используем его только если еще нет значения
                    selectedValues[select.name] = value;
                }
            }
        });
        
        // Также обрабатываем селект подкатегории, если он существует вне формы
        // НО только если он не был уже обработан внутри формы
        const partSubcategorySelect = document.getElementById('partSubcategorySelect');
        if (partSubcategorySelect && !activeFormElement.contains(partSubcategorySelect)) {
            // Проверяем, был ли уже обработан part_subcategory внутри формы
            if (!selectedValues.hasOwnProperty('part_subcategory')) {
                const value = partSubcategorySelect.value || '';
                selectedValues['part_subcategory'] = value;
                console.log(`Part subcategory select (outside form): value="${value}"`);
            } else {
                console.log(`Part subcategory already processed from form: value="${selectedValues['part_subcategory']}"`);
            }
        }

        // Обрабатываем все input элементы (текстовые поля и чекбоксы)
        const allInputs = activeFormElement.querySelectorAll('input[name]:not([type="hidden"])');
        console.log(`Found ${allInputs.length} input elements in ${formSelector}`);

        allInputs.forEach(input => {
            if (input.name) {
                if (input.type === 'checkbox') {
                    // Для чекбоксов сохраняем значение только если они отмечены
                    selectedValues[input.name] = input.checked ? 'on' : '';
                    console.log(`Checkbox ${input.name}:`, input.checked ? 'on' : 'off');
                } else {
                    // Для текстовых полей сохраняем значение как есть
                    selectedValues[input.name] = input.value || '';
                    console.log(`Input ${input.name}:`, input.value);
                }
            }
        });

        // Обработка скрытых полей для брендов/моделей/поколений/модификаций.
        // ВАЖНО: в десктопной форме есть дублирующиеся hidden inputs (например, name="brand"),
        // а JS обновляет именно инпуты с id (#desktopBrandInput и т.п.). Поэтому на десктопе
        // читаем значения из этих id-инпутов в приоритете.

        if (isDesktop) {
            const desktopBrandInput = document.querySelector('#desktopBrandInput');
            if (desktopBrandInput) {
                selectedValues['brand'] = desktopBrandInput.value || '';
                console.log('Desktop brand input:', desktopBrandInput.value || '(empty)');
            } else {
                const formBrandInputs = activeFormElement.querySelectorAll('input[name="brand"][type="hidden"]');
                const brandValue = formBrandInputs.length ? (formBrandInputs[formBrandInputs.length - 1].value || '') : '';
                selectedValues['brand'] = brandValue;
                console.log('Form brand input (fallback):', brandValue || '(empty)');
            }

            const desktopManufacturerInput = document.querySelector('#desktopManufacturerInput');
            if (desktopManufacturerInput) {
                selectedValues['manufacturer'] = desktopManufacturerInput.value || '';
                console.log('Desktop manufacturer input:', desktopManufacturerInput.value || '(empty)');
            } else {
                const formManufacturerInputs = activeFormElement.querySelectorAll('input[name="manufacturer"][type="hidden"]');
                const manufacturerValue = formManufacturerInputs.length ? (formManufacturerInputs[formManufacturerInputs.length - 1].value || '') : '';
                selectedValues['manufacturer'] = manufacturerValue;
                console.log('Form manufacturer input (fallback):', manufacturerValue || '(empty)');
            }

            const desktopModelInput = document.querySelector('#desktopModelInput');
            if (desktopModelInput) {
                selectedValues['model'] = desktopModelInput.value || '';
                console.log('Desktop model input:', desktopModelInput.value || '(empty)');
            } else {
                const formModelInputs = activeFormElement.querySelectorAll('input[name="model"][type="hidden"]');
                const modelValue = formModelInputs.length ? (formModelInputs[formModelInputs.length - 1].value || '') : '';
                selectedValues['model'] = modelValue;
                console.log('Form model input (fallback):', modelValue || '(empty)');
            }

            const desktopGenerationInput = document.querySelector('#desktopGenerationInput');
            if (desktopGenerationInput) {
                selectedValues['generation'] = desktopGenerationInput.value || '';
                console.log('Desktop generation input:', desktopGenerationInput.value || '(empty)');
            } else {
                const formGenerationInputs = activeFormElement.querySelectorAll('input[name="generation"][type="hidden"]');
                const generationValue = formGenerationInputs.length ? (formGenerationInputs[formGenerationInputs.length - 1].value || '') : '';
                selectedValues['generation'] = generationValue;
                console.log('Form generation input (fallback):', generationValue || '(empty)');
            }

            const desktopModificationInput = document.querySelector('#desktopModificationInput');
            if (desktopModificationInput) {
                selectedValues['modification'] = desktopModificationInput.value || '';
                console.log('Desktop modification input:', desktopModificationInput.value || '(empty)');
            } else {
                const formModificationInputs = activeFormElement.querySelectorAll('input[name="modification"][type="hidden"]');
                const modificationValue = formModificationInputs.length ? (formModificationInputs[formModificationInputs.length - 1].value || '') : '';
                selectedValues['modification'] = modificationValue;
                console.log('Form modification input (fallback):', modificationValue || '(empty)');
            }

            // Тип кузова/техники (зависит от show_in)
            const desktopCarTypeInput = document.querySelector('#desktopCarTypeInput');
            if (desktopCarTypeInput) selectedValues['car_type'] = desktopCarTypeInput.value || '';
            const desktopMotoTypeInput = document.querySelector('#desktopMotoTypeInput');
            if (desktopMotoTypeInput) selectedValues['moto_type'] = desktopMotoTypeInput.value || '';
            const desktopTruckTypeInput = document.querySelector('#desktopTruckTypeInput');
            if (desktopTruckTypeInput) selectedValues['truck_type'] = desktopTruckTypeInput.value || '';
            const desktopSpecialTypeInput = document.querySelector('#desktopSpecialTypeInput');
            if (desktopSpecialTypeInput) selectedValues['special_type'] = desktopSpecialTypeInput.value || '';
        } else {
            // На мобильной версии работаем только с активной формой, без десктопных id-инпутов.
            // НО: значения из select имеют приоритет над скрытыми полями
            // Поэтому читаем скрытые поля только если select не обработал это значение
            const formBrandInput = activeFormElement.querySelector('input[name="brand"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('brand') && formBrandInput) {
                selectedValues['brand'] = formBrandInput.value || '';
            }
            console.log('Mobile form brand input:', selectedValues['brand'] || '(empty)');

            const formManufacturerInput = activeFormElement.querySelector('input[name="manufacturer"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('manufacturer') && formManufacturerInput) {
                selectedValues['manufacturer'] = formManufacturerInput.value || '';
            }
            console.log('Mobile form manufacturer input:', selectedValues['manufacturer'] || '(empty)');

            const formModelInput = activeFormElement.querySelector('input[name="model"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('model') && formModelInput) {
                selectedValues['model'] = formModelInput.value || '';
            }
            console.log('Mobile form model input:', selectedValues['model'] || '(empty)');

            const formGenerationInput = activeFormElement.querySelector('input[name="generation"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('generation') && formGenerationInput) {
                selectedValues['generation'] = formGenerationInput.value || '';
            }
            console.log('Mobile form generation input:', selectedValues['generation'] || '(empty)');

            const formModificationInput = activeFormElement.querySelector('input[name="modification"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('modification') && formModificationInput) {
                selectedValues['modification'] = formModificationInput.value || '';
            }
            console.log('Mobile form modification input:', selectedValues['modification'] || '(empty)');

            // Тип кузова/техники (hidden inputs в мобильной форме)
            const formCarTypeInput = activeFormElement.querySelector('input[name="car_type"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('car_type') && formCarTypeInput) {
                selectedValues['car_type'] = formCarTypeInput.value || '';
            }
            const formMotoTypeInput = activeFormElement.querySelector('input[name="moto_type"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('moto_type') && formMotoTypeInput) {
                selectedValues['moto_type'] = formMotoTypeInput.value || '';
            }
            const formTruckTypeInput = activeFormElement.querySelector('input[name="truck_type"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('truck_type') && formTruckTypeInput) {
                selectedValues['truck_type'] = formTruckTypeInput.value || '';
            }
            const formSpecialTypeInput = activeFormElement.querySelector('input[name="special_type"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('special_type') && formSpecialTypeInput) {
                selectedValues['special_type'] = formSpecialTypeInput.value || '';
            }
            
            // Также обрабатываем скрытое поле part_subcategory, если оно не было обработано через select
            const formPartSubcategoryInput = activeFormElement.querySelector('input[name="part_subcategory"][type="hidden"]');
            if (!selectedValues.hasOwnProperty('part_subcategory') && formPartSubcategoryInput) {
                selectedValues['part_subcategory'] = formPartSubcategoryInput.value || '';
                console.log('Mobile form part_subcategory input:', selectedValues['part_subcategory'] || '(empty)');
            }
        }
    } // Закрывающая скобка для if (activeFormElement)

    // Создаем новый URL с нуля, чтобы избежать проблем с остаточными параметрами
    const url = new URL(window.location.origin + window.location.pathname);

    // Принудительно добавляем или удаляем значения всех select элементов
    Object.keys(selectedValues).forEach(key => {
        const value = selectedValues[key];
        // Проверяем, что значение не пустая строка (но '0' и 'false' допустимы)
        if (value && value !== '') {
            url.searchParams.set(key, value);
            console.log(`Force setting ${key}:`, value);
        } else {
            // Явно удаляем параметр, если значение пустое
            url.searchParams.delete(key);
            console.log(`Clearing ${key} (selected "Все" or empty)`);
        }
    });

    // Затем добавляем важные параметры из текущего URL, которые не должны теряться
    // НО НЕ добавляем параметры, которые мы уже обработали выше
    const currentParams = new URLSearchParams(window.location.search);
    const importantParams = ['sort']; // Параметры, которые всегда должны сохраняться
    importantParams.forEach(key => {
        // Не перезаписываем параметры, которые уже установлены из select элементов
        if (!selectedValues.hasOwnProperty(key)) {
            const value = currentParams.get(key);
            if (value) {
                url.searchParams.set(key, value);
            }
        }
    });

    // Отладочная информация
    console.log('Filters URL:', url.toString());
    console.log('Current URL params:', Object.fromEntries(currentParams));

    // Отправляем AJAX запрос
    fetch(url.toString(), {
        method: 'GET',
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => {
        console.log('Response status:', response.status);
        return response.json();
    })
    .then(data => {
        console.log('Response data:', data);
        if (data.success) {
            // Обновляем сетку товаров
            const productsGrid = document.getElementById('productsGrid');
            if (productsGrid && data.products_html) {
                // Заменяем весь контейнер, а не только содержимое
                productsGrid.outerHTML = data.products_html;

                // Инициализируем состояния после обновления товаров
                if (typeof initializeStatesWithData === 'function') {
                    initializeStatesWithData(data.favorite_ids, data.cart_product_ids);
                } else if (typeof initializeStates === 'function') {
                    initializeStates();
                }

                // Настраиваем кнопки корзины
                if (typeof setupCartButtons === 'function') {
                    setupCartButtons();
                }

                // Инициализируем таймеры акций
                if (typeof initSaleTimers === 'function') {
                    initSaleTimers();
                }

                // Переинициализируем dropdown сортировки после обновления
                setTimeout(() => {
                    if (typeof reinitSortDropdown === 'function') {
                        reinitSortDropdown();
                    }
                }, 100);
            }

            // Обновляем URL без перезагрузки страницы
            window.history.replaceState({}, '', url.toString());

            // Обновляем список моделей в десктопном фильтре (после выбора марок) без перезагрузки страницы
            if (data.desktop_models_dropdown_options_html) {
                const modelsOptions = document.querySelector('#modelsDropdown .multiselect-options');
                if (modelsOptions) {
                    modelsOptions.innerHTML = data.desktop_models_dropdown_options_html;
                }
                // Переинициализация выбранных моделей после подмены DOM
                if (typeof initializeDesktopModels === 'function') {
                    initializeDesktopModels();
                }
                if (typeof updateModelsVisibility === 'function') updateModelsVisibility();
            }

            // Обновляем список поколений (после выбора моделей) без перезагрузки страницы
            if (data.desktop_generations_dropdown_options_html) {
                const gensOptions = document.querySelector('#generationsDropdown .multiselect-options');
                if (gensOptions) {
                    gensOptions.innerHTML = data.desktop_generations_dropdown_options_html;
                }
                if (typeof initializeDesktopGenerations === 'function') {
                    initializeDesktopGenerations();
                }
                if (typeof updateGenerationsVisibility === 'function') updateGenerationsVisibility();
            }

            // Обновляем список модификаций (после выбора поколений) без перезагрузки страницы
            if (data.desktop_modifications_dropdown_options_html) {
                const modsOptions = document.querySelector('#modificationsDropdown .multiselect-options');
                if (modsOptions) {
                    modsOptions.innerHTML = data.desktop_modifications_dropdown_options_html;
                }
                if (typeof initializeDesktopModifications === 'function') {
                    initializeDesktopModifications();
                }
            }

            // Обновляем список типов кузова (может сужаться по выбранным брендам/моделям)
            if (data.desktop_car_types_dropdown_options_html) {
                const carTypesOptions = document.querySelector('#carTypesDropdown .multiselect-options');
                if (carTypesOptions) {
                    carTypesOptions.innerHTML = data.desktop_car_types_dropdown_options_html;
                }
                if (typeof initializeDesktopCarTypes === 'function') {
                    initializeDesktopCarTypes();
                }
            }

            // --- Мобильные модалки (offcanvas): обновляем списки без перезагрузки ---
            if (data.mobile_models_modal_list_html) {
                const el = document.getElementById('modelsModalList');
                if (el) el.innerHTML = data.mobile_models_modal_list_html;
            }
            if (data.mobile_generations_modal_list_html) {
                const el = document.getElementById('generationsModalList');
                if (el) el.innerHTML = data.mobile_generations_modal_list_html;
            }
            if (data.mobile_modifications_modal_list_html) {
                const el = document.getElementById('modificationList');
                if (el) el.innerHTML = data.mobile_modifications_modal_list_html;
            }
            if (data.mobile_car_types_modal_list_html) {
                const el = document.getElementById('carTypesModalList');
                if (el) el.innerHTML = data.mobile_car_types_modal_list_html;
            }
            if (data.mobile_moto_types_modal_list_html) {
                const el = document.getElementById('motoTypesModalList');

            }

            // Обновляем счетчик товаров
            const countElement = document.querySelector('.badge.bg-primary');
            if (countElement && data.total_products !== undefined) {
                countElement.textContent = data.total_products;
            }

            // Обновляем текст в селектах на основе текущих GET параметров из URL
            updateMobileFilterTexts();
            
            // Переинициализируем иконки в мобильных селектах после обновления
            // Это нужно, чтобы селекты правильно отображались после AJAX обновления
            if (typeof updateMobileBrandIcon === 'function') {
                updateMobileBrandIcon();
            }
            if (typeof updateMobileModelIcon === 'function') {
                updateMobileModelIcon();
            }
            if (typeof updateMobileGenerationIcon === 'function') {
                updateMobileGenerationIcon();
            }

            // Закрываем мобильный offcanvas после успешного применения фильтров
            // Это делается только если фильтры были применены через кнопку "Применить фильтры"
            const offcanvas = document.getElementById('filtersOffcanvas');
            if (offcanvas && !window.keepOffcanvasOpen) {
                const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvas);
                if (bsOffcanvas) {
                    bsOffcanvas.hide();
                }
            }
            // Сбрасываем флаг
            window.keepOffcanvasOpen = false;
        } else {
            console.error('AJAX response not successful:', data);
        }
    })
    .catch(error => {
        console.error('AJAX Error:', error);
        // Fallback: перезагружаем страницу с новыми параметрами фильтров
        window.location.href = url.toString();
    })
    .finally(() => {
        if (typeof hideLoadingIndicator === 'function') {
            hideLoadingIndicator();
        }
    });
};

    // Автоотправка формы при изменении числовых фильтров
    const debounce = (func, wait) => {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    };

    // Для десктоп формы
    document.querySelectorAll('#filter-form input[name="price_min"], #filter-form input[name="price_max"]').forEach(input => {

    // Сохранение состояния фильтров при возврате на страницу

        }

    // Адаптивная сетка товаров - принудительно 2 товара в ряд на мобильных
    function adjustProductGrid() {

        if (productsGrid) {
            const productCards = productsGrid.querySelectorAll('.col');

            // Удаляем все классы колонок

                // Добавляем базовые классы Bootstrap
                if (window.innerWidth < 768) {
                    // Мобильные: 2 колонки
                    card.classList.add('col-6');
                } else if (window.innerWidth < 992) {
                    // Планшеты: 3 колонки
                    card.classList.add('col-md-4');
                } else {
                    // Десктоп: 4 колонки
                    card.classList.add('col-lg-3');
                }

                // Сохраняем оригинальные классы карточки
                card.classList.add('mb-4');
            });
        }
    }

    // Вызываем при загрузке и изменении размера окна
    adjustProductGrid();
    window.addEventListener('resize', adjustProductGrid);

    // Инициализация Bootstrap dropdown - только Bootstrap, без fallback
    console.log('Initializing Bootstrap dropdowns...');
    console.log('Current URL:', window.location.href);
    console.log('Has subcategory:', {% if subcategory %}true{% else %}false{% endif %});
    console.log('Subcategory name:', '{% if subcategory %}{{ subcategory.name }}{% else %}None{% endif %}');

    // Ждем полной загрузки Bootstrap
    function initDropdowns() {
        if (typeof bootstrap !== 'undefined') {
            console.log('Bootstrap is available, initializing dropdowns');

            // Специальная инициализация для mainSortDropdown
            const mainSortDropdown = document.getElementById('mainSortDropdown');
            if (mainSortDropdown) {
                try {
                    const existingInstance = bootstrap.Dropdown.getInstance(mainSortDropdown);
                    if (existingInstance) {
                        existingInstance.dispose();
                    }

                    // Создаем dropdown явно
                    const mainDropdown = new bootstrap.Dropdown(mainSortDropdown, {
                        autoClose: true,
                        boundary: document.body
                    });

                    console.log('Main sort dropdown initialized');

                    // Добавляем обработчик для отладки
                    mainSortDropdown.addEventListener('shown.bs.dropdown', function () {
                        console.log('Dropdown opened');
                    });
                    mainSortDropdown.addEventListener('hidden.bs.dropdown', function () {
                        console.log('Dropdown closed');
                    });
                } catch (error) {
                    console.error('Error initializing main sort dropdown:', error);
                }
            }

            // Находим все остальные dropdown элементы, исключая дропдауны в модалках адресов
            const dropdownElements = document.querySelectorAll('[data-bs-toggle="dropdown"]:not(#mainSortDropdown):not(#addressListModal [data-bs-toggle="dropdown"]):not(#addressMapModal [data-bs-toggle="dropdown"]):not([data-address-dropdown])');
            console.log('Found other dropdown elements:', dropdownElements.length);

            // Инициализируем каждый dropdown
            dropdownElements.forEach((element, index) => {
                try {
                    const existingInstance = bootstrap.Dropdown.getInstance(element);
                    if (existingInstance) {
                        existingInstance.dispose();
                    }

                    new bootstrap.Dropdown(element, {
                        autoClose: true,
                        boundary: 'viewport'
                    });

                    console.log(`Dropdown ${index + 1} (${element.id || 'unnamed'}) initialized`);
                } catch (error) {
                    console.error(`Error initializing dropdown ${index + 1}:`, error);
                }
            });

            console.log('All dropdowns initialized');
        } else {
            console.error('Bootstrap is not available!');
        }
    }

    // Инициализируем после загрузки
    initDropdowns();
    setTimeout(initDropdowns, 300);

    // Функция для переинициализации dropdown после AJAX обновлений
    // Делаем её глобальной для использования в других местах
    window.reinitSortDropdown = function() {
        const mainSortBtn = document.getElementById('mainSortDropdown');
        if (mainSortBtn) {
            // Убеждаемся, что кнопка кликабельна
            mainSortBtn.style.pointerEvents = 'auto';
            mainSortBtn.style.cursor = 'pointer';
            
            if (typeof bootstrap !== 'undefined') {
                try {
                    // Удаляем старый экземпляр, если есть
                    const existingInstance = bootstrap.Dropdown.getInstance(mainSortBtn);
                    if (existingInstance) {
                        existingInstance.dispose();
                    }

                    // Создаем новый экземпляр dropdown
                    const mainDropdown = new bootstrap.Dropdown(mainSortBtn, {
                        autoClose: true,
                        boundary: document.body
                    });

                    console.log('Sort dropdown reinitialized after AJAX');
                } catch (error) {
                    console.error('Error reinitializing sort dropdown:', error);
                }
            }
        }
    };

    // Добавляем fallback для ручного открытия dropdown, если Bootstrap не работает
    // Но только если Bootstrap dropdown не инициализирован
    const mainSortBtn = document.getElementById('mainSortDropdown');
    if (mainSortBtn) {
        // Убеждаемся, что кнопка кликабельна
        mainSortBtn.style.pointerEvents = 'auto';
        mainSortBtn.style.cursor = 'pointer';
        
        // Используем делегирование событий для избежания конфликтов
        mainSortBtn.addEventListener('click', function(e) {
            console.log('Sort button clicked', e);
            
            // Проверяем, работает ли Bootstrap dropdown
            if (typeof bootstrap !== 'undefined') {
                const dropdownInstance = bootstrap.Dropdown.getInstance(this);
                if (dropdownInstance) {
                    // Bootstrap работает, не вмешиваемся
                    console.log('Bootstrap dropdown is active, letting it handle');
                    return;
                }
            }

            // Fallback: ручное управление dropdown
            e.preventDefault();
            e.stopPropagation();
            
            const dropdownMenu = this.nextElementSibling;
            if (dropdownMenu && dropdownMenu.classList.contains('dropdown-menu')) {
                const isOpen = dropdownMenu.classList.contains('show');
                
                // Закрываем все другие dropdowns
                document.querySelectorAll('.dropdown-menu.show').forEach(menu => {
                    if (menu !== dropdownMenu) {
                        menu.classList.remove('show');
                        const btn = document.querySelector(`[aria-labelledby="${menu.getAttribute('aria-labelledby')}"]`);
                        if (btn) btn.setAttribute('aria-expanded', 'false');
                    }
                });

                // Переключаем текущий dropdown
                dropdownMenu.classList.toggle('show');
                this.setAttribute('aria-expanded', dropdownMenu.classList.contains('show'));
                this.classList.toggle('show', dropdownMenu.classList.contains('show'));

                // Закрываем при клике вне dropdown
                if (dropdownMenu.classList.contains('show')) {
                    setTimeout(() => {
                        const closeHandler = function(e) {
                            if (!mainSortBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                                dropdownMenu.classList.remove('show');
                                mainSortBtn.setAttribute('aria-expanded', 'false');
                                mainSortBtn.classList.remove('show');
                                document.removeEventListener('click', closeHandler);
                            }
                        };
                        document.addEventListener('click', closeHandler);
                    }, 0);
                }
            }
        }, { passive: false });
        
        // Также добавляем обработчик mousedown для более надежного срабатывания
        mainSortBtn.addEventListener('mousedown', function(e) {
            // Убеждаемся, что событие не блокируется
            if (this.style.pointerEvents === 'none') {
                this.style.pointerEvents = 'auto';
            }
        });
    }

    // Обработчики для сортировки
    const sortOptions = document.querySelectorAll('.main-sort-option');
    console.log('Found sort options:', sortOptions.length);
    console.log('Current subcategory context:', '{% if subcategory %}{{ subcategory.name }}{% else %}None{% endif %}');

    sortOptions.forEach((option, index) => {
        console.log(`Setting up sort option ${index}:`, option.textContent.trim(), option.getAttribute('data-sort'));

        option.addEventListener('click', function(e) {
            console.log('Sort option clicked:', this.textContent.trim(), this.getAttribute('data-sort'));
            console.log('Current URL before sort:', window.location.href);
            e.preventDefault();
            const sortValue = this.getAttribute('data-sort');
            console.log('Sort value:', sortValue);

            // Закрываем dropdown
            const dropdownMenu = this.closest('.dropdown-menu');
            if (dropdownMenu) {
                dropdownMenu.classList.remove('show');
                const dropdownButton = document.getElementById('mainSortDropdown');
                if (dropdownButton) {
                    dropdownButton.setAttribute('aria-expanded', 'false');
                }
            }

            // Показываем индикатор загрузки
            showLoadingIndicator();

            // Создаем URL с параметрами
            const url = new URL(window.location);

            // Сохраняем все существующие параметры
            const currentParams = new URLSearchParams(window.location.search);
            currentParams.forEach((value, key) => {
                if (value) {
                    url.searchParams.set(key, value);
                }
            });

            // Устанавливаем новый параметр сортировки
            if (sortValue) {
                url.searchParams.set('sort', sortValue);
            } else {
                url.searchParams.delete('sort');
            }

            // Отправляем AJAX запрос
            fetch(url.toString(), {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Обновляем сетку товаров
                    const productsGrid = document.getElementById('productsGrid');
                    if (productsGrid && data.products_html) {
                        productsGrid.outerHTML = data.products_html;
                    }

                    // Обновляем URL без перезагрузки страницы
                    window.history.replaceState({}, '', url);

                    // Обновляем текст кнопки сортировки
                    updateSortButtonText(sortValue);

                    // Переинициализируем dropdown после обновления
                    setTimeout(() => {
                        reinitSortDropdown();
                    }, 100);

                    // Обновляем счетчик товаров
                    const countElement = document.querySelector('.badge.bg-primary');
                    if (countElement && data.total_products !== undefined) {
                        countElement.textContent = data.total_products;
                    }
                } else {
                    console.error('AJAX response not successful:', data);
                }
            })
            .catch(error => {
                console.error('AJAX Error:', error);
                // Fallback: перезагружаем страницу с новым параметром сортировки
                window.location.href = url.toString();
            })
            .finally(() => {
                hideLoadingIndicator();
            });
        });
    });

    // Функция для обновления текста кнопки сортировки
    function updateSortButtonText(sortValue) {
        const sortButton = document.getElementById('mainSortDropdown');
        if (sortButton) {
            const sortTexts = {
                '': 'По умолчанию',
                'price_asc': 'По возрастанию цены',
                'price_desc': 'По убыванию цены',
                'newest': 'Сначала новые',
                'popular': 'По популярности'
            };
            sortButton.textContent = sortTexts[sortValue] || 'По умолчанию';
            
            // Переинициализируем dropdown после изменения текста
            setTimeout(() => {
                if (typeof window.reinitSortDropdown === 'function') {
                    window.reinitSortDropdown();
                }
            }, 50);
        }
    }
});

<script>
// Динамическое отображение фильтров для шин/дисков
document.addEventListener('DOMContentLoaded', function() {
    const tireWheelTypeSelects = document.querySelectorAll('select[name="tire_wheel_type"]');

    tireWheelTypeSelects.forEach(select => {
        select.addEventListener('change', function() {
            const selectedValue = this.value;
            const form = this.closest('form');

            // Находим контейнеры фильтров в этой форме
            const tireFilters = form.querySelectorAll('.tire-filters');
            const wheelFilters = form.querySelectorAll('.wheel-filters');

            if (selectedValue === 'tire') {
                // Показываем фильтры для шин, скрываем для дисков
                tireFilters.forEach(filter => filter.classList.remove('d-none'));
                wheelFilters.forEach(filter => filter.classList.add('d-none'));
            } else if (selectedValue === 'wheel') {
                // Показываем фильтры для дисков, скрываем для шин
                tireFilters.forEach(filter => filter.classList.add('d-none'));
                wheelFilters.forEach(filter => filter.classList.remove('d-none'));
            } else {
                // Показываем все фильтры
                tireFilters.forEach(filter => filter.classList.remove('d-none'));
                wheelFilters.forEach(filter => filter.classList.remove('d-none'));
            }
        });

        // Инициализируем состояние при загрузке
        const event = new Event('change');
        select.dispatchEvent(event);
    });
});

// Функция для сброса фильтров шин/дисков

    };
    const safeSetText = (el, text) => {
        if (el) el.textContent = text;
    };
    const safeSetChecked = (el, checked) => {
        if (el) el.checked = checked;
    };

    // 1) Подкатегория (если есть)

    safeSetValue(document.getElementById('desktopModificationInput'), '');

}

<script>
// Функции для работы с десктопным мультиселектом производителей
let desktopSelectedManufacturers = [];

function toggleManufacturersDropdown() {
    const dropdown = document.getElementById('manufacturersDropdown');
    dropdown.classList.toggle('show');

    // Инициализируем состояние чекбоксов при открытии
    if (dropdown.classList.contains('show')) {
        initializeDesktopManufacturers();
    }
}

function initializeDesktopManufacturers() {
    const manufacturerInput = document.querySelector('#desktopManufacturerInput');
    const currentManufacturers = manufacturerInput ? manufacturerInput.value.split(',') : [];

    // Сбрасываем все чекбоксы
    document.querySelectorAll('.desktop-manufacturer-checkbox').forEach(checkbox => {
        checkbox.checked = false;
    });

    // Устанавливаем "Все производители" если ничего не выбрано
    if (currentManufacturers.length === 0 || (currentManufacturers.length === 1 && currentManufacturers[0] === '')) {
        document.getElementById('desktopManufacturerAll').checked = true;
        desktopSelectedManufacturers = [];
    } else {
        // Устанавливаем выбранные производители
        currentManufacturers.forEach(manufacturerSlug => {
            if (manufacturerSlug) {
                const checkbox = document.querySelector(`.desktop-manufacturer-checkbox[value="${manufacturerSlug}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                }
            }
        });
        document.getElementById('desktopManufacturerAll').checked = false;
        desktopSelectedManufacturers = currentManufacturers.filter(slug => slug !== '');
    }
}

function toggleDesktopAllManufacturers(checkbox) {
    const manufacturerCheckboxes = document.querySelectorAll('.desktop-manufacturer-checkbox');
    if (checkbox.checked) {
        // Если выбрано "Все производители", снимаем выбор с остальных
        manufacturerCheckboxes.forEach(cb => cb.checked = false);
        desktopSelectedManufacturers = [];
    }
}

function updateDesktopSelectedManufacturers() {
    const manufacturerAll = document.getElementById('desktopManufacturerAll');
    const selectedCheckboxes = document.querySelectorAll('.desktop-manufacturer-checkbox:checked');

    // Если выбраны конкретные производители, снимаем "Все производители"
    if (selectedCheckboxes.length > 0) {
        manufacturerAll.checked = false;
    }

    // Обновляем массив выбранных производителей
    desktopSelectedManufacturers = Array.from(selectedCheckboxes).map(checkbox => checkbox.value);
}

function applyDesktopManufacturerFilter() {
    const manufacturerAll = document.getElementById('desktopManufacturerAll');
    const manufacturerInput = document.querySelector('#desktopManufacturerInput');
    const selectedManufacturerText = document.getElementById('desktopSelectedManufacturerText');

    if (manufacturerAll.checked) {
        // Если выбрано "Все производители"
        if (manufacturerInput) manufacturerInput.value = '';
        if (selectedManufacturerText) selectedManufacturerText.textContent = 'Все производители';
    } else {
        // Если выбраны конкретные производители
        const manufacturerSlugs = desktopSelectedManufacturers.join(',');
        if (manufacturerInput) manufacturerInput.value = manufacturerSlugs;

        // Обновляем текст на кнопке
        if (selectedManufacturerText) {
            if (desktopSelectedManufacturers.length === 0) {
                selectedManufacturerText.textContent = 'Все производители';
            } else if (desktopSelectedManufacturers.length === 1) {
                const selectedCheckbox = document.querySelector(`.desktop-manufacturer-checkbox[value="${desktopSelectedManufacturers[0]}"]`);
                const manufacturerName = selectedCheckbox ? selectedCheckbox.getAttribute('data-name') : 'Производитель';
                selectedManufacturerText.textContent = manufacturerName;
            } else {
                // Получаем названия всех выбранных производителей
                const selectedManufacturerNames = [];
                desktopSelectedManufacturers.forEach(manufacturerSlug => {
                    const checkbox = document.querySelector(`.desktop-manufacturer-checkbox[value="${manufacturerSlug}"]`);
                    if (checkbox) {
                        selectedManufacturerNames.push(checkbox.getAttribute('data-name'));
                    }
                });
                // Отображаем названия через запятую
                selectedManufacturerText.textContent = selectedManufacturerNames.join(', ');
            }
        }
    }

    // Закрываем dropdown
    document.getElementById('manufacturersDropdown').classList.remove('show');

    // Применяем фильтры
    applyFilters();
}

// Закрытие dropdown при клике вне его
document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('manufacturersDropdown');
    const toggle = document.querySelector('.multiselect-toggle[onclick="toggleManufacturersDropdown()"]');

    if (dropdown && toggle && !dropdown.contains(event.target) && !toggle.contains(event.target)) {
        dropdown.classList.remove('show');
    }
});
</script>
