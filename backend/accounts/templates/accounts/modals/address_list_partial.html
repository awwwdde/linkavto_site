{% for address in addresses %}
<div class="address-card {% if address.is_default %}default-address{% endif %} mb-3 p-3 rounded-3">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <div class="d-flex align-items-center mb-2">
                <h6 class="mb-0 fw-semibold">{{ address.title|default:"Основной адрес" }}</h6>
                {% if address.is_default %}
                <span class="badge bg-primary-soft text-primary ms-2 fs-7">Основной</span>
                {% endif %}
            </div>
            <p class="text-muted mb-1 small">{{ address.full_address }}</p>
            <p class="text-muted small mb-0">
                <i class="bi bi-postcard me-1" aria-hidden="true"></i> {{ address.postal_code }}
            </p>
        </div>
        <div class="dropdown">
            <button class="btn btn-link text-muted p-0" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false"
                    aria-label="Действия с адресом">
                <i class="bi bi-three-dots-vertical" aria-hidden="true"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                {% if not address.is_default %}
                <li>
                    <button class="dropdown-item set-default-btn" data-address-id="{{ address.id }}"
                            aria-label="Сделать основным адресом">
                        <i class="bi bi-check-circle me-2" aria-hidden="true"></i>Сделать основным
                    </button>
                </li>
                {% endif %}
                <li>
                    <button class="dropdown-item text-danger delete-address-btn" data-address-id="{{ address.id }}"
                            aria-label="Удалить адрес">
                        <i class="bi bi-trash me-2" aria-hidden="true"></i>Удалить
                    </button>
                </li>
            </ul>
        </div>
    </div>
</div>
{% empty %}
<div class="empty-state text-center py-5">
    <i class="bi bi-map text-muted fs-1 mb-3" aria-hidden="true"></i>
    <p class="text-muted">Нет сохранённых адресов</p>
</div>
{% endfor %}
