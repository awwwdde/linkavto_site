<!-- Модальное окно запроса кода -->
<div class="modal fade" id="requestCodeModal" tabindex="-1" aria-labelledby="requestCodeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="requestCodeModalLabel">Смена пароля</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="verify-code-form" method="post" action="{% url 'accounts:verify_password_code' %}">
          {% csrf_token %}
          <div id="send-code-step">
            <p>Мы отправим 6-значный код подтверждения на вашу электронную почту.</p>
            <button type="button" class="btn btn-primary w-100" id="sendCodeBtn">Отправить код</button>
          </div>
          <div id="enter-code-step" class="mt-4 d-none">
            <div class="mb-3">
              <label for="code" class="form-label">Введите код из письма</label>
              <input type="text" class="form-control text-center" id="code" name="code" maxlength="6" required pattern="\d{6}" placeholder="123456">
            </div>
            <button type="submit" class="btn btn-success w-100">Подтвердить код</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно нового пароля -->
<div class="modal fade" id="setNewPasswordModal" tabindex="-1" aria-labelledby="setNewPasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="setNewPasswordModalLabel">Новый пароль</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form method="post" action="{% url 'accounts:set_new_password' %}">
        {% csrf_token %}
        <div class="modal-body">
          <div class="mb-3">
            <label for="new_password" class="form-label">Новый пароль</label>
            <input type="password" class="form-control" id="new_password" name="new_password"
              pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&]).{6,}$"
              title="Минимум 6 символов, латиница, цифры и спецсимвол" required>
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">Подтвердите пароль</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Сменить пароль</button>
        </div>
      </form>
    </div>
  </div>
</div>
